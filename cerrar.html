<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JENNIPER · Galería cerrada</title>
<style>
  :root{--bg:#0e1014;--ink:#eef1f6;--muted:#8b93a3;--line:#262c36;--accent:#5b8cff}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:24px;text-align:center}
  .caja{max-width:520px}
  .marca{display:inline-grid;place-items:center;width:56px;height:56px;border-radius:16px;
         background:linear-gradient(135deg,var(--accent),#8b5cf6);margin-bottom:22px}
  h1{font-size:24px;letter-spacing:.2em;margin:0 0 14px;font-weight:600}
  p{color:var(--muted);line-height:1.6;margin:0 0 10px}
  hr{border:0;border-top:1px solid var(--line);margin:26px 0}
  small{color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
</style>
</head>
<body>
  <div class="caja">
    <span class="marca" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff" stroke-width="1.6">
        <rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M3.5 17l4.5-4.5 4 4 3-2.5L21 19"/>
      </svg>
    </span>
    <h1>JENNIPER</h1>
    <p>Esta galería ha cerrado y ya no está disponible.</p>
    <p>Las fotos del viaje se han retirado del sitio tras el periodo de publicación acordado.</p>
    <hr>
    <small>Galería compartida · 4 meses</small>
  </div>
</body>
</html>
