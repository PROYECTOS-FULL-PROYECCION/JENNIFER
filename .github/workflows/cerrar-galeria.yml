name: Cierre de la galería

# Se ejecuta el 21 de febrero a las 05:00 UTC (la fecha de cierre del álbum).
# 1. Publica la página de aviso (la galería deja de verse).
# 2. Pasa el repositorio a privado (las fotos dejan de ser públicas en GitHub).
# 3. Intenta borrar el sitio de Pages (en el plan Free ya cae con el paso 2).

on:
  schedule:
    - cron: '0 5 21 2 *'
  workflow_dispatch:
    inputs:
      hacer_privado:
        description: "Pasar el repositorio a privado"
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write
  administration: write

jobs:
  cerrar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Publicar la página de cierre
        run: |
          mkdir -p _site
          cp cerrar.html _site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: despliegue
        uses: actions/deploy-pages@v4

      - name: Volver el repositorio privado
        if: ${{ inputs.hacer_privado }}
        run: |
          gh api --method PATCH "repos/${{ github.repository }}" -f private=true || \
            echo "No se pudo cambiar la visibilidad (hace falta permiso de administracion)."

      - name: Borrar el sitio de Pages
        continue-on-error: true
        run: |
          gh api --method DELETE "repos/${{ github.repository }}/pages" || \
            echo "El sitio de Pages se queda publicado (visible solo en repos privados con GitHub Pro)."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
