<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JENNIPER · Galería compartida</title>
<meta name="description" content="Galería de fotos para compartir: sube, organiza por álbumes y etiquetas, comenta y descarga.">
<link rel="stylesheet" href="assets/css/styles.css">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
</head>
<body>

<a class="skip" href="#galeria">Saltar al contenido</a>

<header class="top">
  <div class="wrap top-inner">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6">
          <rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M3.5 17l4.5-4.5 4 4 3-2.5L21 19"/>
        </svg>
      </span>
      <div>
        <h1>JENNIPER</h1>
        <p class="brand-sub">Galería compartida</p>
      </div>
    </div>

    <div class="top-actions">
      <span class="chip chip-quiet" id="statFotos">0 fotos</span>
      <span class="chip chip-quiet" id="statPeso">0 MB</span>
      <button class="btn primary" id="btnSubir">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 16V4m0 0L7 9m5-5l5 5"/><path d="M4 16v3a1 1 0 001 1h14a1 1 0 001-1v-3"/></svg>
        Subir fotos
      </button>
      <button class="btn icon" id="btnTema" title="Cambiar tema" aria-label="Cambiar tema">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z"/></svg>
      </button>
    </div>
  </div>
</header>

<main class="wrap">

  <p class="aviso" id="aviso" hidden></p>

  <!-- ========== barra de herramientas ========== -->
  <section class="toolbar" aria-label="Filtros">
    <div class="search">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input type="search" id="q" placeholder="Buscar por título, descripción o etiqueta…" aria-label="Buscar fotos">
    </div>

    <div class="toolbar-row">
      <label class="field">
        <span>Álbum</span>
        <select id="fAlbum"><option value="">Todos</option></select>
      </label>
      <label class="field">
        <span>Orden</span>
        <select id="fOrden">
          <option value="nuevas">Más nuevas</option>
          <option value="antiguas">Más antiguas</option>
          <option value="titulo">Título A→Z</option>
          <option value="tamano">Tamaño</option>
        </select>
      </label>
      <div class="field">
        <span>Vista</span>
        <div class="seg" role="group" aria-label="Cambiar vista">
          <button class="seg-btn is-on" data-view="masonry" title="Muro">Muro</button>
          <button class="seg-btn" data-view="grid" title="Rejilla">Rejilla</button>
        </div>
      </div>
      <label class="check">
        <input type="checkbox" id="fFavs"> <span>Solo favoritas</span>
      </label>
    </div>

    <div class="tags" id="fTags" aria-label="Filtrar por etiqueta"></div>
  </section>

  <!-- ========== zona de subida ========== -->
  <section class="uploader" id="uploader" hidden>
    <div class="uploader-head">
      <h2>Nuevas fotos</h2>
      <button class="btn ghost" id="btnCancelarSubida">Cancelar</button>
    </div>
    <div class="uploader-meta">
      <label class="field"><span>Álbum</span><input type="text" id="upAlbum" placeholder="Viajes"></label>
      <label class="field"><span>Etiquetas</span><input type="text" id="upTags" placeholder="paisaje, mar"></label>
      <label class="field"><span>Fecha</span><input type="date" id="upFecha"></label>
    </div>
    <ul class="up-list" id="upList"></ul>
    <div class="uploader-foot">
      <span class="muted" id="upResumen">0 archivos</span>
      <button class="btn primary" id="btnPublicar">Publicar en la galería</button>
    </div>
  </section>

  <!-- ========== galería ========== -->
  <section id="galeria" class="galeria masonry" aria-live="polite"></section>

  <div class="empty" id="vacio" hidden>
    <h3>No hay fotos que mostrar</h3>
    <p>Sube imágenes o cambia los filtros de búsqueda.</p>
  </div>
</main>

<footer class="foot wrap">
  <span>JENNIPER · Página de fotos</span>
  <span class="muted">Las fotos se guardan en este navegador (IndexedDB).</span>
</footer>

<!-- ========== lightbox ========== -->
<div class="lb" id="lb" hidden aria-modal="true" role="dialog" aria-label="Visor de foto">
  <button class="lb-close" id="lbClose" aria-label="Cerrar">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <button class="lb-nav lb-prev" id="lbPrev" aria-label="Anterior">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <button class="lb-nav lb-next" id="lbNext" aria-label="Siguiente">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5l7 7-7 7"/></svg>
  </button>

  <figure class="lb-figure">
    <img id="lbImg" alt="">
    <figcaption class="lb-cap">
      <div class="lb-titulo">
        <h3 id="lbTitle"></h3>
        <p id="lbMeta" class="muted"></p>
      </div>

      <div class="lb-acciones">
        <button class="btn ghost" id="lbFav" title="Marcar como favorita">
          <span id="lbFavIcon">♡</span> <span id="lbFavTxt">Favorita</span>
        </button>
        <button class="btn ghost" id="lbCopiar" title="Copiar enlace a esta foto">Copiar enlace</button>
        <button class="btn ghost" id="lbDescargar" title="Descargar imagen">Descargar</button>
        <button class="btn danger" id="lbBorrar" title="Eliminar foto">Eliminar</button>
      </div>

      <div class="lb-tags" id="lbTags"></div>

      <div class="lb-comments">
        <h4>Comentarios <span class="muted" id="lbNumComments"></span></h4>
        <ul id="lbComments" class="comments"></ul>
        <form class="comment-form" id="lbForm">
          <input type="text" id="lbAutor" placeholder="Tu nombre" aria-label="Tu nombre" maxlength="40">
          <input type="text" id="lbTexto" placeholder="Escribe un comentario…" aria-label="Comentario" maxlength="500" required>
          <button class="btn" type="submit">Enviar</button>
        </form>
      </div>
    </figcaption>
  </figure>
</div>

<!-- ========== toast ========== -->
<div class="toasts" id="toasts" aria-live="polite"></div>

<input type="file" id="fileInput" accept="image/*" multiple hidden>
<input type="file" id="dropInput" accept="image/*" multiple hidden>

<script src="assets/js/db.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
